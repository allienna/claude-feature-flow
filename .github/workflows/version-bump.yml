name: Version bump

# Bumps the plugin version on every push to main, driven by the
# Conventional Commit header of the merge commit:
#   feat:                    -> minor   (e.g. a new command)
#   fix: / perf: / refactor:  -> patch   (e.g. fixing an existing command)
#   feat!: / BREAKING CHANGE  -> major
#   anything else (docs:, chore:, ci:, ...) -> no bump
#
# The header is looked up as the first line of the full commit message
# (`git log -1 --pretty=%B`) that matches a Conventional Commit header.
# That covers squash-merge commits (header is the subject) as well as
# GitHub "merge commit" merges (header is usually the first line of the body).
#
# When a bump happens it updates .claude-plugin/plugin.json and
# .claude-plugin/marketplace.json against the current state of main,
# commits the change as "chore(release): vX.Y.Z" and pushes a matching tag.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Never react to our own release commit (also guards against loops).
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        run: |
          message="$(git log -1 --pretty=%B)"
          # First line that looks like a Conventional Commit header.
          header="$(printf '%s\n' "$message" | grep -Em1 '^[a-z]+(\([^)]*\))?!?:' || true)"
          echo "Conventional Commit header: ${header:-<none>}"
          type=""
          if printf '%s\n' "$message" | grep -q 'BREAKING CHANGE' \
             || printf '%s' "$header" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            type=major
          elif printf '%s' "$header" | grep -Eq '^feat(\([^)]*\))?!?:'; then
            type=minor
          elif printf '%s' "$header" | grep -Eq '^(fix|perf|refactor)(\([^)]*\))?!?:'; then
            type=patch
          fi
          if [ -z "$type" ]; then
            echo "No conventional commit type that warrants a version bump — skipping."
          else
            echo "Bump type: $type"
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag
        if: steps.bump.outputs.type != ''
        run: |
          set -euo pipefail

          # Re-sync to the current tip of main so the version is computed and
          # committed on top of any release commit a prior run may have pushed
          # (queued runs are serialized by the concurrency group, but this run's
          # checkout is the triggering SHA, which may already be stale).
          git fetch origin main
          git checkout -B main origin/main

          current="$(jq -r .version .claude-plugin/plugin.json)"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ steps.bump.outputs.type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "Bumping $current -> $new"

          tmp="$(mktemp)"
          jq --arg v "$new" '.version = $v' .claude-plugin/plugin.json > "$tmp" && mv "$tmp" .claude-plugin/plugin.json
          jq --arg v "$new" '.plugins |= map(if .name == "claude-feature-flow" then .version = $v else . end)' .claude-plugin/marketplace.json > "$tmp" && mv "$tmp" .claude-plugin/marketplace.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(release): v$new"
          git tag "v$new"
          git push origin HEAD:main
          git push origin "v$new"
